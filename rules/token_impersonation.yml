Name: "Token Impersonation (PrintSpoofer/Services)"
MitreID: "T1134"
Severity: "CRITICAL"
Description: "Dịch vụ hoặc công cụ lạm dụng Token để sinh shell quyền SYSTEM"
Condition:
  EventID: "1"
  ParentImage: 
    - '*\services.exe'
    - '*\spoolsv.exe'
    - '*printspoofer*'
  Image: 
    - '*\cmd.exe'
    - '*\powershell.exe'
  IntegrityLevel: "*system*"